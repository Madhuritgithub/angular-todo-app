<div class="todo-container">
    <h1>My To-Do App</h1>
  
<form (submit)="addTask(); $event.preventDefault()">
  <input [(ngModel)]="newTask" placeholder="Enter new task" name="task" />
  <button [disabled]="!newTask.trim()">Add Task</button>
</form>

    <ul>
  <li *ngFor="let task of tasks; let i = index" class="task-item">
    <span>{{ task }}</span>
    <button (click)="deleteTask(i)">Delete</button>
  </li>
</ul>
